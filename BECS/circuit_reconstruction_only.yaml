name: DBBS Mouse cerebellum configuration v4.2
network:
  chunk_size:
  - 100.0
  - 100.0
  - 100.0
  x: 300.0
  y: 200.0
  z: 595
partitions:
  b_molecular_layer:
    thickness: 50.0
  dcn_layer:
    origin:
    - 0
    - 0
    - -200
    thickness: 200
  granular_layer:
    thickness: 130.0
  io_layer:
    origin:
    - 0
    - 0
    - -300
    thickness: 100
  purkinje_layer:
    thickness: 15.0
  t_molecular_layer:
    thickness: 100.0
placement:
  basket_layer_placement:
    cell_types:
    - basket_cell
    partitions:
    - b_molecular_layer
    strategy: bsb.placement.RandomPlacement
  dcn_i_layer_placement:
    cell_types:
    - dcn_i
    partitions:
    - dcn_layer
    strategy: bsb.placement.RandomPlacement
  dcn_p_layer_placement:
    cell_types:
    - dcn_p
    partitions:
    - dcn_layer
    strategy: bsb.placement.RandomPlacement
  granular_layer_innervation:
    cell_types:
    - mossy_fibers
    partitions:
    - granular_layer
    strategy: bsb.placement.RandomPlacement
  granular_layer_placement:
    cell_types:
    - granule_cell
    - golgi_cell
    - glomerulus
    partitions:
    - granular_layer
    strategy: bsb.placement.RandomPlacement
  io_layer_placement:
    cell_types:
    - io
    partitions:
    - io_layer
    strategy: bsb.placement.RandomPlacement
  purkinje_layer_placement:
    angle: 80.0
    cell_types:
    - purkinje_cell
    partitions:
    - purkinje_layer
    spacing_x: 130.0
    strategy: bsb.placement.ParallelArrayPlacement
  stellate_layer_placement:
    cell_types:
    - stellate_cell
    partitions:
    - t_molecular_layer
    strategy: bsb.placement.RandomPlacement
regions:
  cerebellar_cortex:
    children:
    - granular_layer
    - purkinje_layer
    - b_molecular_layer
    - t_molecular_layer
    type: stack
  cerebellar_nuclei:
    children:
    - dcn_layer
    type: group
  inferior_olivary:
    children:
    - io_layer
    type: group
storage:
  engine: hdf5
  root: mouse_cerebellum.hdf5
